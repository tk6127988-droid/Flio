 el.parentNode.insertBefore(det,el);
 if(wrap)body.appendChild(el);else{while(el.firstChild)body.appendChild(el.firstChild);el.remove()}
 if(FOLDO[key])det.open=true;

 return det}

  on conflict (name) do update

        games = public.world_scores.games + 1,
        updated = now();
end $$;

language sql security definer set search_path = public as $$

create or replace function public.claim_name(p_name text,p_token text) returns text language plpgsql security definer set search_path=public as $$
declare n text; t text;
begin
 n:=left(trim(coalesce(p_name,'')),14);
 if length(n)<2 or length(coalesce(p_token,''))<8 then raise exception 'bad name'; end if;
 select token into t from public.player_names where name_lc=lower(n);
 if t is null then
  begin
   insert into public.player_names(name_lc,name,token) values(lower(n),n,p_token);
   return 'ok';
  exception when unique_violation then return 'taken';
  end;
 end if;
 if t=p_token then return 'ok'; end if;
 return 'taken';
end $$;

create or replace function public.fund_create(p_city text,p_name text,p_lon real,p_lat real,p_title text,p_goal bigint,p_hours int,p_maxact int default 1) returns bigint language plpgsql security definer set search_path=public as $$
declare v bigint;
begin
 if (select count(*) from public.fundraisers where city_id=p_city and ends>now() and not done)>=least(greatest(coalesce(p_maxact,1),1),5) then raise exception 'You already have the maximum number of active fundraisers.'; end if;
 insert into public.fundraisers(city_id,city_name,lon,lat,title,goal,ends) values(left(p_city,40),left(p_name,20),p_lon,p_lat,left(p_title,40),least(greatest(p_goal,100),10000000),now()+make_interval(hours=>least(greatest(coalesce(p_hours,48),1),168))) returning id into v;
 return v;
end $$;

create or replace function public.fund_pledge(p_id bigint,p_amt bigint,p_from text,p_from_id text,p_bonus int default 10) returns json language plpgsql security definer set search_path=public as $$
declare f public.fundraisers; a bigint; b int; r record; fin boolean:=false;
begin
 b:=least(greatest(coalesce(p_bonus,0),0),25);
 select * into f from public.fundraisers where id=p_id for update;
 if not found or f.done or f.ends<=now() then raise exception 'That fundraiser has closed.'; end if;
 if f.city_id=p_from_id then raise exception 'You cannot fund your own fundraiser.'; end if;
 a:=least(greatest(p_amt,1),100000);
 update public.fundraisers set raised=raised+a,backers=backers+1 where id=p_id returning * into f;
 insert into public.fund_backers(fid,from_id,from_name,amt) values(p_id,left(p_from_id,40),left(p_from,20),a);
 insert into public.city_events(to_id,kind,amt,from_name,from_id) values(f.city_id,'fund',a,left(p_from,20),f.title);
 if f.raised>=f.goal then
  fin:=true;
  update public.fundraisers set done=true where id=p_id;
  insert into public.city_events(to_id,kind,amt,from_name,from_id) values(f.city_id,'fundok',floor(f.goal*b/100.0),f.city_name,f.title);
  for r in select from_id as bid,sum(amt) as s from public.fund_backers where fid=p_id group by from_id loop
   insert into public.city_events(to_id,kind,amt,from_name,from_id) values(r.bid,'fundok',floor(r.s*b/100.0),f.city_name,f.title);
  end loop;
 end if;
 return json_build_object('raised',f.raised,'goal',f.goal,'done',fin);
end $$;

/* ---- the chain itself, applied after every other part of the economy ---- */
const oEc=cEco;
cEco=function(){
 const E=oEc.apply(this,arguments);
 try{
  if(!CITY||window.VIS||!E||!E.eff)return E;
  const n=CITY.g.length,wf=Math.max(0,Math.min(1,num(E.wf,1))),pf=num(E.pf,1);
  let fs=0,pc=0,mc=0,nF=0,nM=0,nP=0;
  /* 1) farms grow food (need water, power, workers and a road) */
  CITY.g.forEach((b,i)=>{if(!b)return;const s=cS(b.t),m=CM[b.l];
   if(s.role=='farm'){nF++;const ef=num(E.eff[i])*(.4+.6*wf);fs+=PER_FARM*m*ef;
    const old=num(E.eff[i]);E.eff[i]=ef;E.rate+=s.inc*m*(ef-old)*((E.act&&E.act[i]!=null)?E.act[i]:1);
    if(!E.msg[i]||ef>.6)E.msg[i]=wf<.6?'💧 Dry fields: build Water works so crops grow.':ef<.5?'Farm is short of workers, power or a road.':'Growing food for the city.'}
   else if(s.role=='foodplant'){nP++;pc+=PER_PLANT*m*num(E.eff[i])}
   else if(s.role=='market'){nM++;mc+=s.sv*m*pf}});
  /* 2) food plant turns up to 50% extra value out of the produce, markets deliver it to homes */
  const proc=fs+.5*Math.min(fs,pc),R=num(E.R);
  const cov=R>BACKYARD?Math.min(1,mc/(R-BACKYARD)):1,dist=.5+.5*cov;
  const sup=proc*dist+BACKYARD,fed=R>0?Math.min(1,sup/R):1;
  const mult=.15+.85*fed,fmult=.6+.4*fed;
  E.food={fs,proc,pc,mc,cov,dist,sup,fed,mult,nF,nM,nP,R,raw:R>0?Math.min(1,(fs+BACKYARD)/R):1};
  /* 3) hungry people cannot work: everything else slows down, farms less so they can recover */
  const H0=num(E.H),up=num(E.up);let dlt=0;
  CITY.g.forEach((b,i)=>{if(!b)return;const s=cS(b.t),m=CM[b.l];if(s.role=='road'||s.role=='farm')return;
   const a=(E.act&&E.act[i]!=null)?E.act[i]:1,ef=num(E.eff[i]);dlt+=s.inc*m*ef*a*(mult-1);E.eff[i]=ef*mult;
   if(fed<.85)E.msg[i]='🍞 Hungry city: people need food to work ('+Math.round(fed*100)+'% fed). '+(E.msg[i]||'')});
  CITY.g.forEach((b,i)=>{if(!b)return;const s=cS(b.t);if(s.role!='farm')return;const m=CM[b.l],a=(E.act&&E.act[i]!=null)?E.act[i]:1,ef=num(E.eff[i]);dlt+=s.inc*m*ef*a*(fmult-1);E.eff[i]=ef*fmult});
  const f0=.8+.4*H0,gross=(num(E.rate)+up)/(f0||1)+dlt;
  const H1=R>0?Math.max(0,Math.min(1,H0*(.5+.5*fed))):0;
  E.H=H1;E.rate=gross*(.8+.4*H1)-up;
  if(R>BACKYARD&&fed<.99){E.warn.unshift(fed<.5?'🍞 FAMINE: only '+Math.round(fed*100)+'% of residents are fed, so buildings barely work. Build Farms (and a Food market).':'🍞 Food shortage: '+Math.round(fed*100)+'% fed. Build more Farms'+(cov<.8?', a Food market':'')+(wf<.7?' and Water works':'')+'.')}
  else if(R>BACKYARD&&nM==0&&nF>0)E.warn.push('🧺 A Food market would deliver food to every home (without one only half of it arrives).');
 }catch(e){try{console.warn('food chain',e)}catch(_){}}
 return E};
