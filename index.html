create or replace function public.world_cities() returns setof public.cities language sql security definer set search_path=public as $$
 select * from public.cities where updated>now()-interval '14 days' order by score desc limit 60 $$;
create or replace function public.city_event(p_to text,p_kind text,p_amt bigint,p_from text) returns void language sql security definer set search_path=public as $$
 insert into public.city_events(to_id,kind,amt,from_name) values(p_to,p_kind,least(greatest(p_amt,0),10000000),left(p_from,20)) $$;
create or replace function public.my_events(p_id text) returns table(kind text,amt bigint,from_name text) language sql security definer set search_path=public as $$
 delete from public.city_events where to_id=p_id returning kind,amt,from_name $$;
grant execute on function public.upsert_city(text,text,real,real,bigint,int,real,bigint), public.world_cities(), public.city_event(text,text,bigint,text), public.my_events(text) to anon, authenticated;

-- Airport visits: airport level + skyline summary per city (run once; 'updated' is the last-seen time)
alter table public.cities add column if not exists ap int not null default 0;
alter table public.cities add column if not exists bl text not null default '';
drop function if exists public.upsert_city(text,text,real,real,bigint,int,real,bigint);
create or replace function public.upsert_city(p_id text,p_name text,p_lon real,p_lat real,p_score bigint,p_def int,p_happy real,p_hit bigint,p_ap int default 0,p_bl text default '') returns void language plpgsql security definer set search_path=public as $$
begin
 if length(p_id)<4 or p_score<0 or p_score>1000000000000 then raise exception 'bad city'; end if;
 insert into public.cities(id,name,lon,lat,score,def,happy,hit,updated,ap,bl) values(p_id,left(p_name,20),p_lon,p_lat,p_score,p_def,p_happy,p_hit,now(),least(greatest(p_ap,0),3),left(p_bl,200))
 on conflict(id) do update set name=excluded.name,score=excluded.score,def=excluded.def,happy=excluded.happy,hit=excluded.hit,updated=now(),ap=excluded.ap,bl=excluded.bl;
end $$;
grant execute on function public.upsert_city(text,text,real,real,bigint,int,real,bigint,int,text) to anon, authenticated;

-- 3D visits: each city's layout is stored here; it is handed out when the city has an airport (owner online or offline)
create table if not exists public.city_layouts(id text primary key,lay text,updated timestamptz default now());
alter table public.city_layouts enable row level security;
create or replace function public.save_layout(p_id text,p_lay text) returns void language plpgsql security definer set search_path=public as $$
begin
 if length(p_id)<4 or length(p_lay)>12000 then raise exception 'bad layout'; end if;
 insert into public.city_layouts(id,lay,updated) values(p_id,p_lay,now()) on conflict(id) do update set lay=excluded.lay,updated=now();
end $$;
create or replace function public.city_layout(p_id text) returns text language sql security definer set search_path=public as $$
 select l.lay from public.city_layouts l join public.cities c on c.id=l.id where l.id=p_id and c.ap>0 $$;
grant execute on function public.save_layout(text,text), public.city_layout(text) to anon, authenticated;

-- Tourism deals: events now remember who sent them
alter table public.city_events add column if not exists from_id text;
create or replace function public.city_event2(p_to text,p_kind text,p_amt bigint,p_from text,p_from_id text) returns void language sql security definer set search_path=public as $$
 insert into public.city_events(to_id,kind,amt,from_name,from_id) values(p_to,p_kind,least(greatest(p_amt,0),10000000),left(p_from,20),left(p_from_id,40)) $$;
drop function if exists public.my_events(text);
create or replace function public.my_events(p_id text) returns table(kind text,amt bigint,from_name text,from_id text) language sql security definer set search_path=public as $$
 delete from public.city_events where to_id=p_id returning kind,amt,from_name,from_id $$;
grant execute on function public.city_event2(text,text,bigint,text,text), public.my_events(text) to anon, authenticated;

-- Your own rank, shown automatically (no searching the list)
create or replace function public.my_world_rank(p_name text) returns table(rank bigint,total integer,games integer) language sql security definer set search_path=public as $$
 select r.rank,r.total,r.games from (select name,total,games,row_number() over(order by total desc,games asc,name) as rank from public.world_scores) r where r.name=left(trim(coalesce(p_name,'')),14) $$;
create or replace function public.my_daily_rank(p_day text,p_name text) returns table(rank bigint,score integer) language sql security definer set search_path=public as $$
 select r.rank,r.score from (select name,score,row_number() over(order by score desc,created asc) as rank from public.daily_scores where day=p_day) r where r.name=left(trim(coalesce(p_name,'')),14) $$;
create or replace function public.my_biz_rank(p_name text) returns table(rank bigint,wins integer,best integer) language sql security definer set search_path=public as $$
 select r.rank,r.wins,r.best from (select name,wins,best,row_number() over(order by wins desc,best desc,name) as rank from public.biz_scores) r where r.name=left(trim(coalesce(p_name,'')),14) $$;
grant execute on function public.my_world_rank(text), public.my_daily_rank(text,text), public.my_biz_rank(text) to anon, authenticated;`;

function bizBot(f){
 const c=f.cash,r=Math.random();
 let p=r<.25?9:r<.8?12:16,m=c>2500&&Math.random()<.5?800:c>900&&Math.random()<.5?300:0,u=f.q<4&&c>3000&&Math.random()<.5?1000:f.q<4&&c>1200&&Math.random()<.4?400:0;

 while(bizChk(f,p,m,u,s,l)){if(l)l=0;else if(s!=f.st)s=f.st;else if(u)u=0;else if(m)m=0;else break}
 f.d={p,m,u,s,l};f.ok=true;

function bizNorm(p,m,u,s,l){const n=[p,m,u,s,l].map(Number);return[Math.round(n[0]*100)/100,Math.round(n[1]),Math.round(n[2]),Math.round(n[3]),Math.round(n[4])]}
const bizIn=(id,lb,v,ex)=>`<div class="row"><span style="flex:1">${lb}</span><input id="${id}" type="number" inputmode="decimal" value="${v}" ${ex} style="flex:none;width:110px"></div>`;
function bizChk(f,p,m,u,s,l){
 if(![p,m,u,s,l].every(Number.isFinite))return 'Enter a number in every box.';
 if(p<=0)return 'Price must be more than $0.';
 if(m<0||u<0||s<0)return 'Not possible: marketing, quality and staff can’t be negative.';
 if(l<0&&-l>f.debt)return 'Not possible: you only owe $'+f.debt+', so you can’t repay $'+(-l)+'.';
 const hire=Math.max(0,s-f.st)*150,sp=m+u+hire+(l<0?-l:0),av=Math.max(0,f.cash)+(l>0?l:0);
 if(sp>av)return 'Not possible: this costs $'+sp+' (marketing $'+m+', quality $'+u+(hire?', hiring $'+hire:'')+(l<0?', repayment $'+(-l):'')+') but you only have $'+Math.round(av)+'.';
 return '';
}

function bizResolve(){
 const B=BZ,F=B.F,ev=BEV[Math.floor(Math.random()*BEV.length)],D=100*F.length*ev[1];
 F.forEach(f=>{
  const d=f.d,r=Math.random(),hire=Math.max(0,d.s-f.st)*150;
  f.cash+=d.l;f.debt+=d.l;
  f.st=d.s;f.sp=d.m+d.u+hire;f.cash-=f.sp;
  f.q=Math.min(5,f.q+d.u/450);f.br=f.br*.6+Math.min(1.5,d.m/1600);
  f.inc=r<.12?1:r<.2?2:r<.28?3:0;
 });
 const a=F.map(f=>(1+.35*f.q)*(1+f.br)*Math.pow(12/f.d.p,1.3)*(f.inc==3?1.3:1)),sum=a.reduce((x,y)=>x+y,0);
 F.forEach((f,i)=>{
  const sh=a[i]/sum,want=Math.round(D*sh),cap=40+30*f.st,cu=Math.min(want,cap),rev=Math.round(cu*f.d.p);
  const cost=Math.round(cu*(4+1.2*f.q)*(f.inc==1?1.3:1)+150+100*f.st),it=Math.round(f.debt*.08),bk=f.inc==2?250:0;
  const pre=rev-cost-it-bk-f.sp,tax=pre>0?Math.round(pre*.15):0;
  f.cash+=rev-cost-it-bk-tax;
  const note=[];
  if(want>cap)note.push('⚠ at capacity, lost '+(want-cap)+' customers');
  if(f.inc==1)note.push('🚚 supplier prices up');
  if(f.inc==2)note.push('🛠 breakdown −$250');
  if(f.inc==3)note.push('📰 press feature');
  if(it)note.push('interest $'+it);
  if(tax)note.push('tax $'+tax);
  f.last={sh,cu,pf:pre-tax,note};
 });
 B.ev=ev[0];B.ph='res';bizSync();
}

function ownCss(){
 const keys=['bg','fg','card','mut','ac','ok','bd','bk'],mk=o=>keys.filter(k=>o&&o[k]).map(k=>'--'+k+':'+o[k]).join(';');
 const L=mk(CFG.theme.light),D=mk(CFG.theme.dark);
 let e=document.getElementById('ownCss');if(!e){e=document.createElement('style');e.id='ownCss';document.head.appendChild(e)}
 e.textContent=(L?':root{'+L+'}':'')+(D?'@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){'+D+'}}:root[data-theme="dark"]{'+D+'}':'');
}
function applyCfg(){
 Object.keys(CFG.ct||{}).forEach(k=>{if(CT[k]&&Array.isArray(CFG.ct[k]))CT[k]=CFG.ct[k].slice()});
 [['csz',CSZ],['cup',CUP],['cvl',CVL]].forEach(([k,arr])=>{if(Array.isArray(CFG[k])&&CFG[k].length==arr.length)CFG[k].forEach((v,i)=>arr[i]=+v)});
 try{Object.keys(CFG.vt||{}).forEach(k=>{if(VT[k])Object.assign(VT[k],CFG.vt[k])})}catch(e){}
 const t=CFG.texts||{};
 ['i','n','d'].forEach(f=>{const T=f=='i'?PWI:f=='n'?PWN:PWD;Object.keys((t.pw||{})).forEach(k=>{if(t.pw[k]&&t.pw[k][f])T[k]=t.pw[k][f]})});
 const h=document.getElementById('ttl');if(h)h.textContent=CFG.title||'🔒 Flio';
 document.title='Flio';ownCss();
}
