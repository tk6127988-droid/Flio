const WSQL=`-- Lock & Flip world ranking: run once in Supabase > SQL Editor.
-- Anyone can submit a round score and read the top 10. No accounts needed.

create table if not exists public.world_scores (
  name    text primary key,
  total   integer not null default 0,
  games   integer not null default 0,
  updated timestamptz not null default now()
);

alter table public.world_scores enable row level security;  -- no direct table access

create or replace function public.submit_score(p_name text, p_points integer)
returns void language plpgsql security definer set search_path = public as $$
begin
  p_name := left(trim(coalesce(p_name,'')), 14);
  if length(p_name) < 1 or p_points is null or p_points < 0 or p_points > 100 then
    raise exception 'bad score';
  end if;
  insert into public.world_scores(name, total, games)
  values (p_name, p_points, 1)
  on conflict (name) do update
    set total = public.world_scores.total + excluded.total,
        games = public.world_scores.games + 1,
        updated = now();
end $$;

create or replace function public.world_leaderboard()
returns table(name text, total integer, games integer)
language sql security definer set search_path = public as $$
  select name, total, games from public.world_scores order by total desc, games asc limit 100;
$$;

grant execute on function public.submit_score(text, integer) to anon, authenticated;
grant execute on function public.world_leaderboard() to anon, authenticated;

  primary key (day, name)
);

alter table public.daily_scores enable row level security;

create or replace function public.submit_daily(p_name text, p_day text, p_score integer)
returns void language plpgsql security definer set search_path = public as $$

  p_name := left(trim(coalesce(p_name,'')), 14);
  if length(p_name) < 1 or p_score is null or p_score < 0 or p_score > 60 then
    raise exception 'bad score';
  end if;
  if p_day is distinct from to_char((now() at time zone 'utc'), 'YYYY-MM-DD') then
    raise exception 'bad day';
  end if;
  insert into public.daily_scores(day, name, score) values (p_day, p_name, p_score)
  on conflict (day, name) do nothing;
end $$;

create or replace function public.submit_biz(p_name text, p_final integer, p_won boolean)

create or replace function public.claim_name(p_name text,p_token text) returns text language plpgsql security definer set search_path=public as $$
declare n text; t text;
begin
 n:=left(trim(coalesce(p_name,'')),14);
 if length(n)<2 or length(coalesce(p_token,''))<8 then raise exception 'bad name'; end if;
 select token into t from public.player_names where name_lc=lower(n);
 if t is null then
  begin
   insert into public.player_names(name_lc,name,token) values(lower(n),n,p_token);
   return 'ok';
  exception when unique_violation then return 'taken';
  end;
 end if;
 if t=p_token then return 'ok'; end if;
 return 'taken';
end $$;

create table if not exists public.fundraisers(id bigserial primary key,city_id text,city_name text,lon real,lat real,title text,goal bigint,raised bigint not null default 0,backers int not null default 0,ends timestamptz,done boolean not null default false,created timestamptz default now());

create or replace function public.fund_create(p_city text,p_name text,p_lon real,p_lat real,p_title text,p_goal bigint,p_hours int,p_maxact int default 1) returns bigint language plpgsql security definer set search_path=public as $$
declare v bigint;
begin
 if (select count(*) from public.fundraisers where city_id=p_city and ends>now() and not done)>=least(greatest(coalesce(p_maxact,1),1),5) then raise exception 'You already have the maximum number of active fundraisers.'; end if;
 insert into public.fundraisers(city_id,city_name,lon,lat,title,goal,ends) values(left(p_city,40),left(p_name,20),p_lon,p_lat,left(p_title,40),least(greatest(p_goal,100),10000000),now()+make_interval(hours=>least(greatest(coalesce(p_hours,48),1),168))) returning id into v;
 return v;
end $$;
create or replace function public.fund_list() returns setof public.fundraisers language sql security definer set search_path=public as $$
 select * from public.fundraisers where not done and ends>now() order by created desc limit 80 $$;
create or replace function public.fund_pledge(p_id bigint,p_amt bigint,p_from text,p_from_id text,p_bonus int default 10) returns json language plpgsql security definer set search_path=public as $$
declare f public.fundraisers; a bigint; b int; r record; fin boolean:=false;
begin
 b:=least(greatest(coalesce(p_bonus,0),0),25);
 select * into f from public.fundraisers where id=p_id for update;
 if not found or f.done or f.ends<=now() then raise exception 'That fundraiser has closed.'; end if;
 if f.city_id=p_from_id then raise exception 'You cannot fund your own fundraiser.'; end if;
 a:=least(greatest(p_amt,1),100000);
 update public.fundraisers set raised=raised+a,backers=backers+1 where id=p_id returning * into f;
 insert into public.fund_backers(fid,from_id,from_name,amt) values(p_id,left(p_from_id,40),left(p_from,20),a);
 insert into public.city_events(to_id,kind,amt,from_name,from_id) values(f.city_id,'fund',a,left(p_from,20),f.title);
 if f.raised>=f.goal then
  fin:=true;
  update public.fundraisers set done=true where id=p_id;
  insert into public.city_events(to_id,kind,amt,from_name,from_id) values(f.city_id,'fundok',floor(f.goal*b/100.0),f.city_name,f.title);
  for r in select from_id as bid,sum(amt) as s from public.fund_backers where fid=p_id group by from_id loop
   insert into public.city_events(to_id,kind,amt,from_name,from_id) values(r.bid,'fundok',floor(r.s*b/100.0),f.city_name,f.title);
  end loop;
 end if;
 return json_build_object('raised',f.raised,'goal',f.goal,'done',fin);
end $$;
grant execute on function public.fund_create(text,text,real,real,text,bigint,int,int), public.fund_list(), public.fund_pledge(bigint,bigint,text,text,int) to anon, authenticated;

function bizBot(f){
 const c=f.cash,r=Math.random();
 let p=r<.25?9:r<.8?12:16,m=c>2500&&Math.random()<.5?800:c>900&&Math.random()<.5?300:0,u=f.q<4&&c>3000&&Math.random()<.5?1000:f.q<4&&c>1200&&Math.random()<.4?400:0;
 let s=c>1500&&f.st<4&&Math.random()<.3?f.st+1:c<600&&f.st>2&&Math.random()<.5?f.st-1:f.st,l=c<400&&f.debt<=2000?1000:c>2500&&f.debt>=1000&&Math.random()<.5?-1000:0;
 while(bizChk(f,p,m,u,s,l)){if(l)l=0;else if(s!=f.st)s=f.st;else if(u)u=0;else if(m)m=0;else break}
 f.d={p,m,u,s,l};f.ok=true;
}
const bnw=f=>f.cash-f.debt+250*f.q;
function bizNorm(p,m,u,s,l){const n=[p,m,u,s,l].map(Number);return[Math.round(n[0]*100)/100,Math.round(n[1]),Math.round(n[2]),Math.round(n[3]),Math.round(n[4])]}
const bizIn=(id,lb,v,ex)=>`<div class="row"><span style="flex:1">${lb}</span><input id="${id}" type="number" inputmode="decimal" value="${v}" ${ex} style="flex:none;width:110px"></div>`;
function bizChk(f,p,m,u,s,l){
 if(![p,m,u,s,l].every(Number.isFinite))return 'Enter a number in every box.';
 if(p<=0)return 'Price must be more than $0.';
 if(m<0||u<0||s<0)return 'Not possible: marketing, quality and staff can’t be negative.';
 if(l<0&&-l>f.debt)return 'Not possible: you only owe $'+f.debt+', so you can’t repay $'+(-l)+'.';
 const hire=Math.max(0,s-f.st)*150,sp=m+u+hire+(l<0?-l:0),av=Math.max(0,f.cash)+(l>0?l:0);
 if(sp>av)return 'Not possible: this costs $'+sp+' (marketing $'+m+', quality $'+u+(hire?', hiring $'+hire:'')+(l<0?', repayment $'+(-l):'')+') but you only have $'+Math.round(av)+'.';
 return '';
}

function bizResolve(){
 const B=BZ,F=B.F,ev=BEV[Math.floor(Math.random()*BEV.length)],D=100*F.length*ev[1];
 F.forEach(f=>{
  const d=f.d,r=Math.random(),hire=Math.max(0,d.s-f.st)*150;
  f.cash+=d.l;f.debt+=d.l;
  f.st=d.s;f.sp=d.m+d.u+hire;f.cash-=f.sp;
  f.q=Math.min(5,f.q+d.u/450);f.br=f.br*.6+Math.min(1.5,d.m/1600);
  f.inc=r<.12?1:r<.2?2:r<.28?3:0;
 });
 const a=F.map(f=>(1+.35*f.q)*(1+f.br)*Math.pow(12/f.d.p,1.3)*(f.inc==3?1.3:1)),sum=a.reduce((x,y)=>x+y,0);
 F.forEach((f,i)=>{
  const sh=a[i]/sum,want=Math.round(D*sh),cap=40+30*f.st,cu=Math.min(want,cap),rev=Math.round(cu*f.d.p);
  const cost=Math.round(cu*(4+1.2*f.q)*(f.inc==1?1.3:1)+150+100*f.st),it=Math.round(f.debt*.08),bk=f.inc==2?250:0;
  const pre=rev-cost-it-bk-f.sp,tax=pre>0?Math.round(pre*.15):0;
  f.cash+=rev-cost-it-bk-tax;
  const note=[];
  if(want>cap)note.push('⚠ at capacity, lost '+(want-cap)+' customers');
  if(f.inc==1)note.push('🚚 supplier prices up');
  if(f.inc==2)note.push('🛠 breakdown −$250');
  if(f.inc==3)note.push('📰 press feature');
  if(it)note.push('interest $'+it);
  if(tax)note.push('tax $'+tax);
  f.last={sh,cu,pf:pre-tax,note};
 });
 B.ev=ev[0];B.ph='res';bizSync();
}

function cHit(sx,sy){

 for(let d=2*GN-2;d>=0;d--)for(let x=0;x<GN;x++){const y=d-x;if(y<0||y>=GN)continue;const b=cB(x,y);if(!b)continue;const p=cP(x+.5,y+.5);if(Math.abs(wx-p[0])<TW*.8&&wy<p[1]+TH&&wy>p[1]-cHh(b)-TH)return[x,y]}
 const dx=wx/TW,dy=wy/TH,gx=Math.floor((dx+dy)/2),gy=Math.floor((dy-dx)/2);

}

}

const cRGB=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const cSh=(h,k)=>'rgb('+(Array.isArray(h)?h:cRGB(h)).map(v=>Math.max(0,Math.min(255,v*k))|0).join(',')+')';

(()=>{
try{
const num=(v,d)=>{v=+v;return isFinite(v)?v:(d||0)};
const FD={
 farm:['Farm','🌾',600,5,0,8,-1,0,'#8bc34a'],

const FCAT={farm:'wrk',market:'svc',foodplant:'wrk'};
/* put the new buildings right after the Apartment in the build menu */
(()=>{const o=Object.assign({},CT),keys=Object.keys(o).filter(k=>!FD[k]),ord=[];
 keys.forEach(k=>{ord.push(k);if(k=='apartment'){ord.push('farm','market','foodplant')}});
 if(!ord.includes('farm'))ord.push('farm','market','foodplant');
 Object.keys(CT).forEach(k=>{delete CT[k]});
 ord.forEach(k=>{CT[k]=o[k]||FD[k]});
 for(const k in FD)CRL[k]=FCAT[k];
 try{CHT.farm=l=>26+4*l;CHT.market=l=>30+4*l;CHT.foodplant=l=>44+6*l}catch(e){}
})();
const BACKYARD=12,PER_FARM=30,PER_PLANT=25;
const isF=r=>r=='farm'||r=='market'||r=='foodplant';

/* farms work in daylight, markets in trading hours */
const oAM=actM;
actM=function(role,h){
 if(role=='farm'||role=='market'){const x=((h%24)+24)%24;
  if(role=='farm')return x>=5&&x<19?1:.35;
  return x>=7&&x<21?1:.3}
 return oAM.apply(this,arguments)};

/* ---- the chain itself, applied after every other part of the economy ---- */
const oEc=cEco;
cEco=function(){
 const E=oEc.apply(this,arguments);
 try{
  if(!CITY||window.VIS||!E||!E.eff)return E;
  const n=CITY.g.length,wf=Math.max(0,Math.min(1,num(E.wf,1))),pf=num(E.pf,1);
  let fs=0,pc=0,mc=0,nF=0,nM=0,nP=0;
  /* 1) farms grow food (need water, power, workers and a road) */
  CITY.g.forEach((b,i)=>{if(!b)return;const s=cS(b.t),m=CM[b.l];
   if(s.role=='farm'){nF++;const ef=num(E.eff[i])*(.4+.6*wf);fs+=PER_FARM*m*ef;
    const old=num(E.eff[i]);E.eff[i]=ef;E.rate+=s.inc*m*(ef-old)*((E.act&&E.act[i]!=null)?E.act[i]:1);
    if(!E.msg[i]||ef>.6)E.msg[i]=wf<.6?'💧 Dry fields: build Water works so crops grow.':ef<.5?'Farm is short of workers, power or a road.':'Growing food for the city.'}
   else if(s.role=='foodplant'){nP++;pc+=PER_PLANT*m*num(E.eff[i])}
   else if(s.role=='market'){nM++;mc+=s.sv*m*pf}});
  /* 2) food plant turns up to 50% extra value out of the produce, markets deliver it to homes */
  const proc=fs+.5*Math.min(fs,pc),R=num(E.R);
  const cov=R>BACKYARD?Math.min(1,mc/(R-BACKYARD)):1,dist=.5+.5*cov;
  const sup=proc*dist+BACKYARD,fed=R>0?Math.min(1,sup/R):1;
  const mult=.15+.85*fed,fmult=.6+.4*fed;
  E.food={fs,proc,pc,mc,cov,dist,sup,fed,mult,nF,nM,nP,R,raw:R>0?Math.min(1,(fs+BACKYARD)/R):1};
  /* 3) hungry people cannot work: everything else slows down, farms less so they can recover */
  const H0=num(E.H),up=num(E.up);let dlt=0;
  CITY.g.forEach((b,i)=>{if(!b)return;const s=cS(b.t),m=CM[b.l];if(s.role=='road'||s.role=='farm')return;
   const a=(E.act&&E.act[i]!=null)?E.act[i]:1,ef=num(E.eff[i]);dlt+=s.inc*m*ef*a*(mult-1);E.eff[i]=ef*mult;
   if(fed<.85)E.msg[i]='🍞 Hungry city: people need food to work ('+Math.round(fed*100)+'% fed). '+(E.msg[i]||'')});
